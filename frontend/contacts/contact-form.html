href="../assets/css/common.css">


<link rel="stylesheet"
href="../assets/css/layout.css">

</head>



<body>


<div class="app-layout">



<!-- Sidebar -->


<aside class="sidebar">


<div class="logo">

AMS

<ul class="sidebar-menu">


<li>

href="contacts.html">

<li>

<i data-lucide="megaphone"></i>

<li>

<a href="../queue/queue.html">

<i data-lucide="list-ordered"></i>

Queue

<li>

<i data-lucide="bar-chart-3"></i>

<li>

<a href="../settings/settings.html">

<i data-lucide="settings"></i>

Settings

</a>

</li>


</ul>


</aside>







<!-- Main Content -->


<main class="main-content">



<div class="topbar">


<h5 class="mb-0">

Add Contact

</h5>




<div>


<span class="badge whatsapp-status">

Checking...

</span>



<button class="btn btn-sm btn-outline-secondary ms-3"
onclick="logout()">

Logout

</button>



</div>


</div>







<div class="page-content fade-in">





<div class="row justify-content-center">


<div class="col-lg-8">





<div class="card shadow-soft p-4">



<h5 class="mb-4">

Add Contact

</h5>





<form id="contactForm">



<div class="row">



<div class="col-md-6 mb-3">


<label class="form-label">

First Name

</label>


<input
type="text"
id="first_name"
class="form-control"
required>


</div>





<div class="col-md-6 mb-3">


<label class="form-label">

Last Name

</label>


<input
type="text"
id="last_name"
class="form-control">


</div>



</div>







<div class="row">



<div class="col-md-6 mb-3">


<label class="form-label">

Phone

</label>


<input
type="text"
id="phone"
class="form-control"
required>


</div>






<div class="col-md-6 mb-3">


<label class="form-label">

Company

</label>


<input
type="text"
id="company"
class="form-control">


</div>



</div>








<div class="mb-3">


<label class="form-label">

Group

</label>

<select
id="group_id"
class="form-select">

<option value="">
Select Group
</option>

</select>


</div>








<div class="mb-3">


<label class="form-label">

Tags

</label>


<input
type="text"
id="tags"
class="form-control"
placeholder="Customer, VIP">


</div>








<div class="text-end">


<a href="contacts.html"
class="btn btn-secondary">

Cancel

</a>



<button
class="btn btn-primary"
type="submit">

Save Contact

</button>



</div>




</form>




</div>





</div>


</div>






<div id="appFooter"></div>




</div>





</main>



</div>
