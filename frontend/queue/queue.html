<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AMS - Queue</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Theme -->
    <link rel="stylesheet"
          href="../assets/css/theme.css">

    <link rel="stylesheet"
          href="../assets/css/common.css">

    <link rel="stylesheet"
          href="../assets/css/layout.css">

    <link rel="stylesheet"
          href="queue.css">

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

</head>

<body>

<div class="app-layout">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">

            <i data-lucide="send"></i>

            AMS

        </div>

        <ul class="sidebar-menu">

            <li>

                <a href="../dashboard/dashboard.html">

                    <i data-lucide="layout-dashboard"></i>

                    Dashboard

                </a>

            </li>

            <li>

                <a href="../contacts/contacts.html">

                    <i data-lucide="users"></i>

                    Contacts

                </a>

            </li>

            <li>

                <a href="../groups/groups.html">

                    <i data-lucide="folder-open"></i>

                    Groups

                </a>

            </li>

            
            <li>
                <a href="../templates/templates.html">
                  <i data-lucide="file-text"></i>
                  Templates
               </a>
            </li>

            <li>

                <a href="../campaigns/campaigns.html">

                    <i data-lucide="megaphone"></i>

                    Campaigns

                </a>

            </li>

            <li>

                <a href="queue.html"
                   class="active">

                    <i data-lucide="list-ordered"></i>

                    Queue

                </a>

            </li>

            <li>

                <a href="../reports/reports.html">

                    <i data-lucide="bar-chart-3"></i>

                    Reports

                </a>

            </li>

            <li>

                <a href="../settings/settings.html">

                    <i data-lucide="settings"></i>

                    Settings

                </a>

            </li>

        </ul>

    </aside>

    <!-- Main -->

    <main class="main-content">

        <div class="topbar">

            <h4 class="mb-0">

                Message Queue

            </h4>

            <button
                class="btn btn-primary"
                onclick="loadQueue()">

                <i data-lucide="refresh-cw"></i>

                Refresh

            </button>

        </div>

        <div class="page-content">

            <!-- Summary Cards -->

            <div class="cards">

                <div class="card summary-card shadow-soft">

                    <h6>Total Queue</h6>

                    <p id="totalQueue">0</p>

                </div>

                <div class="card summary-card shadow-soft">

                    <h6>Pending</h6>

                    <p id="pendingQueue">0</p>

                </div>

                <div class="card summary-card shadow-soft">

                    <h6>Sent</h6>

                    <p id="sentQueue">0</p>

                </div>

                <div class="card summary-card shadow-soft">

                    <h6>Failed</h6>

                    <p id="failedQueue">0</p>

                </div>

            </div>

            <!-- Queue Table -->

            <div class="card shadow-soft mt-4">

                <div class="card-body queue-table">

                    <table
                        class="table table-hover align-middle">

                        <thead>

                            <tr>

                                <th>Campaign</th>

                                <th>Recipient</th>

                                <th>Phone</th>

                                <th>Status</th>

                                <th>Retry</th>

                                <th>Error</th>

                                <th>Created</th>

                                <th>Processed</th>

                                <th>Action</th>

                            </tr>

                        </thead>

                        <tbody id="queueTable">

                            <tr>

                                <td colspan="9"
                                    class="text-center">

                                    Loading Queue...

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

                <div id="appFooter"></div>

    </main>

</div>

<script src="../assets/js/api.js"></script>

<script src="../assets/js/common.js"></script>

<script src="../assets/js/branding.js"></script>


<script src="queue.js"></script>

<script>

    lucide.createIcons();

</script>

</body>

</html>
