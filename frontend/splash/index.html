<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Auto Message System
    </title>


    <link rel="stylesheet"
          href="css/splash.css">

</head>


<body>


<div class="splash">


    <!-- Cinematic Background -->
    <div class="background"></div>


    <!-- Gold Ambient Glow -->
    <div class="gold-glow"></div>


    <!-- Logo -->
    <div class="brand">

        <img src="../assets/images/logo.png"
             alt="Auto Message System">

    </div>


    <!-- Metallic Light Sweep -->
    <div class="shine"></div>


    <!-- Loading Area -->
    <div class="loader-box">


        <div class="progress-container">

            <div id="progressBar"></div>

        </div>


        <div class="progress-info">


            <span id="statusText">
                Initializing System...
            </span>


            <span id="progressValue">
                0%
            </span>


        </div>


    </div>


</div>



<script src="js/splash.js"></script>


</body>

</html>
