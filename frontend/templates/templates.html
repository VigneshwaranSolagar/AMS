<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AMS - Templates</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="../assets/css/theme.css">

<link rel="stylesheet"
href="../assets/css/common.css">

<link rel="stylesheet"
href="../assets/css/layout.css">

<link rel="stylesheet"
href="templates.css">

<script src="https://unpkg.com/lucide@latest"></script>

</head>

<body>

<div class="app-layout">

<!-- Sidebar -->

<aside class="sidebar">

<div class="logo">

<i data-lucide="send"></i>

AMS

</div>

<ul class="sidebar-menu">

<li>

<a href="../dashboard/dashboard.html">

<i data-lucide="layout-dashboard"></i>

Dashboard

</a>

</li>

<li>

<a href="../contacts/contacts.html">

<i data-lucide="users"></i>

Contacts

</a>

</li>

<li>

<a class="active"
href="templates.html">

<i data-lucide="file-text"></i>

Templates

</a>

</li>

<li>

<a href="../campaigns/campaigns.html">

<i data-lucide="megaphone"></i>

Campaigns

</a>

</li>

<li>

<a href="../queue/queue.html">

<i data-lucide="list-ordered"></i>

Queue

</a>

</li>

<li>

<a href="../reports/reports.html">

<i data-lucide="bar-chart-3"></i>

Reports

</a>

</li>

<li>

<a href="../settings/settings.html">

<i data-lucide="settings"></i>

Settings

</a>

</li>

</ul>

</aside>



<!-- Main -->

<main class="main-content">

<div class="topbar">

<h4 class="mb-0">

Message Templates

</h4>

<button
id="btnAddTemplate"
class="btn btn-primary">

<i data-lucide="plus"></i>

New Template

</button>

</div>



<div class="page-content fade-in">

<!-- Summary -->

<div class="row g-3 mb-4">

<div class="col-lg-3 col-md-6">

<div class="stats-card">

<div>

<p>Total Templates</p>

<h3 id="totalTemplates">

0

</h3>

</div>

<div class="stats-icon">

<i data-lucide="file-text"></i>

</div>

</div>

</div>



<div class="col-lg-3 col-md-6">

<div class="stats-card">

<div>

<p>Text</p>

<h3 id="textTemplates">

0

</h3>

</div>

<div class="stats-icon text-primary">

<i data-lucide="message-square-text"></i>

</div>

</div>

</div>



<div class="col-lg-3 col-md-6">

<div class="stats-card">

<div>

<p>Media</p>

<h3 id="mediaTemplates">

0

</h3>

</div>

<div class="stats-icon text-success">

<i data-lucide="image"></i>

</div>

</div>

</div>



<div class="col-lg-3 col-md-6">

<div class="stats-card">

<div>

<p>Variables Used</p>

<h3 id="variablesUsed">

0

</h3>

</div>

<div class="stats-icon text-warning">

<i data-lucide="braces"></i>

</div>

</div>

</div>

</div>



<!-- Search -->

<div class="card shadow-soft mb-4">

<div class="card-body">

<div class="row g-3 align-items-center">

<div class="col-lg-6">

<input
type="text"
id="searchTemplate"
class="form-control"
placeholder="Search templates...">

</div>

<div class="col-lg-3">

<select
id="filterType"
class="form-select">

<option value="">

All Templates

</option>

<option value="TEXT">

Text Only</option>

<option value="IMAGE">

Image</option>

<option value="VIDEO">

Video</option>

<option value="DOCUMENT">

Document</option>

</select>

</div>

<div class="col-lg-3 text-end">

<span
class="badge bg-primary"
id="templateCounter">

0 Templates

</span>

</div>

</div>

</div>

</div>



<!-- Table -->

<div class="card shadow-soft">

<div class="card-body">

<div class="table-responsive">

<table class="table table-hover align-middle">

<thead>

<tr>

<th width="70">

S.No

</th>

<th width="240">

Template

</th>

<th>

Preview

</th>

<th width="220">

Variables

</th>

<th width="170">

Attachment

</th>

<th width="160">

Actions

</th>

</tr>

</thead>

<tbody id="templatesTable">

<tr>

<td colspan="6"
class="text-center py-5">

Loading...

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

</div>



<div id="appFooter"></div>

</main>

</div>

<script src="../assets/js/api.js"></script>

<script src="../assets/js/common.js"></script>

<script src="../assets/js/branding.js"></script>

<script src="templates.js"></script>

<script>

lucide.createIcons();

</script>

</body>

</html>
