<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AMS Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../assets/css/theme.css">
<link rel="stylesheet" href="../assets/css/common.css">

<script src="https://unpkg.com/lucide@latest"></script>

</head>


<body>


<div class="container vh-100 d-flex align-items-center justify-content-center">


<div class="card shadow-lg border-0 rounded-4"
     style="width:420px;">


<div class="card-body p-5">


<div class="text-center mb-4">


<img src="../assets/images/logo-sidebar.png"
     class="logo-image"
     style="width:80px;">


<h4 class="mt-3">
Auto Message System
</h4>


<p class="text-muted">
Administrator Login
</p>


</div>



<form id="loginForm">


<div class="mb-3">

<input type="text"
       id="username"
       class="form-control"
       placeholder="User ID (Mobile Number)"
       required>

</div>



<div class="mb-3">



<input type="password"
       id="password"
       class="form-control"
       placeholder="Password"
       required>

</div>



<button
    id="loginBtn"
    type="submit"
    class="btn btn-primary w-100 btn-lg">
    Login
</button>
<div id="loginMessage" class="mt-2"></div>

</form>



<hr class="my-4">



<button class="btn btn-outline-success w-100 mb-2"
        onclick="openRegister()">

Create Account

</button>



<button class="btn btn-outline-secondary w-100"
        onclick="openReset()">

Forgot Password

</button>


<div id="loginStatus"
     class="mt-3 text-center">
</div>


<div id="registerMessage"
     class="mt-3 text-center"></div>
</div>

</div>

</div>




<!-- ACCOUNT CREATION MODAL -->

<div class="modal fade"
     id="registerModal">

<div class="modal-dialog">

<div class="modal-content">


<div class="modal-header">

<h5>
Create AMS Account
</h5>

<button class="btn-close"
        data-bs-dismiss="modal"></button>

</div>



<div class="modal-body">


<form id="registerForm">


<input class="form-control mb-3"
       placeholder="Full Name"
       id="regName"
       required>


<input type="tel" pattern="[0-9]{10}" class="form-control mb-3"
       placeholder="Mobile Number (10 digits)"
       id="regMobile"
       maxlength="10"
       inputmode="numeric"
       required>


<input class="form-control mb-3"
       placeholder="Business Name"
       id="regBusiness"
       required>


<input class="form-control mb-3"
       placeholder="GSTN / PAN"
       id="regTax"
       required>


<input type="password"
       class="form-control mb-3"
       placeholder="Password(Min 6 chars, letters & numbers)"
       id="regPassword"
       minlength="6"
       required>


<input type="password"
       class="form-control mb-3"
       placeholder="Confirm Password"
       id="regConfirmPassword"
       minlength="6"
       required>


<button class="btn btn-success w-100">

Create Account

</button>

</form>


</div>


</div>

</div>

</div>





<!-- PASSWORD RESET MODAL -->


<div class="modal fade"
     id="resetModal">


<div class="modal-dialog">

<div class="modal-content">


<div class="modal-header">

<h5>
Reset Password
</h5>

<button class="btn-close"
        data-bs-dismiss="modal"></button>
<div id="resetMessage"
     class="mt-3 text-center"></div>
</div>



<div class="modal-body">

<form id="resetForm">

<input class="form-control mb-3"
       placeholder="Registered GSTN / PAN"
       id="resetGstPan"
       required>

<input type="password"
       class="form-control mb-3"
       placeholder="New Password"
       id="resetPassword"
       required>

<input type="password"
       class="form-control mb-3"
       placeholder="Confirm Password"
       id="resetConfirmPassword"
       required>

<button class="btn btn-warning w-100">
    Reset Password
</button>

</form>

</div>

</div>

</div>

</div>





<script src="../assets/js/api.js"></script>

<script src="../assets/js/auth.js"></script>

<script src="../assets/js/branding.js"></script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>



<script>


lucide.createIcons();



function openRegister(){

    new bootstrap.Modal(
        document.getElementById("registerModal")
    ).show();

}



function openReset(){

    new bootstrap.Modal(
        document.getElementById("resetModal")
    ).show();

}


</script>


<script src="../assets/js/footer.js"></script>


</body>

</html>
