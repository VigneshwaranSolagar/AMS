<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>

        AMS - Campaign Builder

    </title>

    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Google Font -->

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Theme -->

    <link
        rel="stylesheet"
        href="../assets/css/theme.css">

    <link
        rel="stylesheet"
        href="../assets/css/common.css">

    <link
        rel="stylesheet"
        href="../assets/css/layout.css">

    <link
        rel="stylesheet"
        href="campaign-form.css">

    <!-- Lucide -->

    <script src="https://unpkg.com/lucide@latest"></script>

</head>

<body>

<div class="app-layout">

    <!-- Sidebar -->

    <aside class="sidebar">


    <div class="logo">

     <img
        src="../assets/images/logo-sidebar.png"
        alt="AMS Logo"
        class="logo-image">

    </div>

        <ul class="sidebar-menu">


<li>

<a href="../dashboard/dashboard.html">

<i data-lucide="layout-dashboard"></i>

Dashboard

</a>

</li>



<li>

<a class="active" href="../contacts/contacts.html">

<i data-lucide="users"></i>

Contacts

</a>

</li>

<li>

<a href="../templates/templates.html">

<i data-lucide="file-text"></i>

Templates

</a>

</li>




<li>

<a href="../campaigns/campaigns.html">

<i data-lucide="megaphone"></i>

Campaigns

</a>

</li>




<li>

<a href="../queue/queue.html">

<i data-lucide="list-ordered"></i>

Queue

</a>

</li>




<li>

<a href="../reports/reports.html">

<i data-lucide="bar-chart-3"></i>

Reports

</a>

</li>




<li>

<a href="../settings/settings.html">

<i data-lucide="settings"></i>

Settings

</a>

</li>


</ul>
    </aside>

    <!-- Main -->

    <main class="main-content">

        <div class="topbar">

            <h5 id="pageTitle">

                Campaign Builder

            </h5>

        </div>

        <div class="page-content">

            <form
                id="campaignForm">

                <input
                    type="hidden"
                    id="campaignId">

                <div class="row">

                    <!-- LEFT -->

                    <div class="col-lg-7">

                        <!-- Campaign Details -->

                        <div class="card shadow-soft mb-4">

                            <div class="card-header">

                                Campaign Details

                            </div>

                            <div class="card-body">

                                <div class="mb-3">

                                    <label class="form-label">

                                        Campaign Name

                                    </label>

                                    <input
                                        type="text"
                                        id="campaign_name"
                                        class="form-control"
                                        required>

                                </div>

                                <div class="row">

                                    <div class="col-md-6">

                                        <label class="form-label">

                                            Campaign Type

                                        </label>

                                        <select
                                            id="campaign_type"
                                            class="form-select">

                                            <option value="Instant">

                                                Instant

                                            </option>

                                            <option value="Scheduled">

                                                Scheduled

                                            </option>

                                        </select>

                                    </div>

                                    <div class="col-md-6">

                                        <label class="form-label">

                                            Business Entity

                                        </label>

                                        <select
                                            id="business_entity"
                                            class="form-select">

                                            <option value="1">

                                                Default Business

                                            </option>

                                        </select>

                                    </div>

                                </div>

                            </div>

                        </div>

                        <!-- Audience -->

                        <div class="card shadow-soft mb-4">

                            <div class="card-header">

                                Target Audience

                            </div>

                            <div class="card-body">

                                <div class="mb-3">

                                    <label>

                                        Target Type

                                    </label>

                                    <select
                                        id="targetType"
                                        class="form-select">


                                        <option value="All">

                                            All Contacts

                                        </option>

                                        <option value="Group">

                                            Contact Group

                                        </option>

                                        <option value="Contacts">

                                            Selected Contacts

                                        </option>

                                        <option value="Manual">

                                            Manual Numbers

                                        </option>

                                    </select>

                                </div>

                                <div id="targetContainer">

                                </div>

                            </div>

                        </div>

                        <!-- Message -->

                        <div class="card shadow-soft mb-4">

                            <div class="card-header">

                                Message

                            </div>

                            <div class="card-body">

                                <div class="mb-3">

                                    <label>

                                        Template

                                    </label>

                                    <select
                                        id="template"
                                        class="form-select">

                                        <option value="">

                                            Select Template

                                        </option>

                                    </select>

                                </div>

                                <div class="mb-3">

                                    <label>

                                        Message

                                    </label>

                                    <textarea
                                        id="message"
                                        rows="10"
                                        class="form-control"></textarea>

                                </div>

                                <div class="mb-3">

                                    <label>

                                        Attachment

                                    </label>

                                    <input
                                        type="file"
                                        id="attachment"
                                        class="form-control"
                                        accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip">
                                </div>

                            </div>

                        </div>

                        <!-- Schedule -->

                        <div
                            id="scheduleCard"
                            class="card shadow-soft mb-4 d-none">

                            <div class="card-header">

                                Schedule

                            </div>

                            <div class="card-body">

                                <input
                                    type="datetime-local"
                                    id="scheduled_at"
                                    class="form-control">

                            </div>

                        </div>

                    </div>

                    <!-- RIGHT -->

                    <div class="col-lg-5">

                        <div class="card shadow-soft sticky-top">

                            <div class="card-header">

                                WhatsApp Preview

                            </div>

                            <div class="card-body">

                                <div
                                    id="previewMessage"
                                    class="whatsapp-preview">

                                    Your message will appear here...

                                </div>

                                <hr>

                                <div
                                    id="attachmentPreview">

                                    No attachment

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

                <div
                    class="text-end mt-4">

                    <a
                        href="campaigns.html"
                        class="btn btn-secondary">

                        Cancel

                    </a>

                    <button
                        type="button"
                        id="btnDraft"
                        class="btn btn-warning">

                        Save Draft

                    </button>

                    <button
                        type="submit"
                        class="btn btn-success">

                        Queue Campaign

                    </button>

                </div>

            </form>

        </div>

                <div id="appFooter"></div>

    </main>

</div>

<script src="../assets/js/api.js"></script>

<script src="../assets/js/common.js"></script>

<script src="../assets/js/branding.js"></script>

<script src="campaign-form.js"></script>

<script>

lucide.createIcons();

</script>
<script src="../assets/js/footer.js"></script>
</body>

</html>
