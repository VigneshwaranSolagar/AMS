<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AMS Licensing</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="../assets/css/theme.css">

    <link rel="stylesheet"
          href="../assets/css/common.css">

    <script src="https://unpkg.com/lucide@latest"></script>

</head>

<body>

<div class="container vh-100 d-flex align-items-center justify-content-center">

    <div class="card shadow-lg border-0 rounded-4"
         style="max-width:700px;width:100%;">

        <div class="card-body p-5">

            <div class="text-center mb-4">

                <i data-lucide="shield-check"
                   style="width:64px;height:64px;"
                   class="text-primary">
                </i>

                <h5 class="mt-3 fw-bold">
                    AMS Licensing
                </h5>

                <p class="text-muted mb-0">
                    Offline License Activation
                </p>

            </div>

            <hr>

            <div class="mb-4">

                <label class="form-label fw-semibold">

                    Machine Fingerprint

                </label>

                <input
                    type="text"
                    id="fingerprint"
                    class="form-control"
                    readonly>

                <div class="mt-3">

                    <button
                        type="button"
                        id="btnCopy"
                        class="btn btn-outline-primary">

                        <i data-lucide="copy"></i>

                        Copy Fingerprint

                    </button>

                </div>

                <small class="text-muted d-block mt-2">

                    Send this fingerprint to VinSolve to receive your
                    <strong>license.lic</strong> file.

                </small>

            </div>

            <hr>

            <div class="mb-4">

                <h6 class="fw-semibold mb-3">

                    Acceptance

                </h6>

                <div class="form-check mb-2">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="acceptLicense">

                    <label
                        class="form-check-label"
                        for="acceptLicense">

                        I have read and agree to the
                        <a href="../legal/license-agreement.html"
                           target="_blank">

                            License Agreement

                        </a>

                    </label>

                </div>

                <div class="form-check">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="acceptPrivacy">

                    <label
                        class="form-check-label"
                        for="acceptPrivacy">

                        I have read and agree to the
                        <a href="../legal/privacy.html"
                           target="_blank">

                            Privacy Policy

                        </a>

                    </label>

                </div>

            </div>

            <hr>

            <div class="mb-4">

                <label class="form-label fw-semibold">

                    Import License File

                </label>

                <input
                    type="file"
                    id="licenseFile"
                    class="form-control"
                    accept=".lic">

                <div class="mt-2">

                    <small
                        id="selectedFile"
                        class="text-muted">

                        No file selected.

                    </small>

                </div>

                <div class="mt-3">

                    <button
                        type="button"
                        id="btnImport"
                        class="btn btn-success"
                        disabled>

                        <i data-lucide="upload"></i>

                        Import License

                    </button>

                </div>

            </div>

            <div id="message"></div>

        </div>

    </div>

</div>

<script src="../assets/js/branding.js"></script>


<script>

lucide.createIcons();

</script>

<script src="../assets/js/footer.js"></script>

</body>

</html>
