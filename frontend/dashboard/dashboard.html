<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>AMS Dashboard</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">


<link rel="stylesheet"
href="../assets/css/theme.css">

<link rel="stylesheet"
href="../assets/css/common.css">

<link rel="stylesheet"
href="../assets/css/layout.css">

<link rel="stylesheet" href="dashboard.css">

<script src="https://unpkg.com/lucide@latest"></script>


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>


<body>


<div class="app-layout">


<!-- Sidebar -->

<aside class="sidebar">



    <div class="logo">

     <img
        src="../assets/images/logo-sidebar.png"
        alt="AMS Logo"
        class="logo-image">

    </div>


<ul class="sidebar-menu">


<li>
<a href="dashboard.html">

<i data-lucide="layout-dashboard"></i>

Dashboard

</a>
</li>


<li>
<a href="../contacts/contacts.html">

<i data-lucide="users"></i>

Contacts

</a>
</li>


<li>
<a href="../templates/templates.html">

<i data-lucide="file-text"></i>

Templates

</a>
</li>


<li>
<a href="../campaigns/campaigns.html">

<i data-lucide="megaphone"></i>

Campaigns

</a>
</li>


<li>
<a href="../queue/queue.html">

<i data-lucide="list-ordered"></i>

Queue

</a>
</li>


<li>
<a href="../reports/reports.html">

<i data-lucide="bar-chart-3"></i>

Reports

</a>
</li>


<li>
<a href="../settings/settings.html">

<i data-lucide="settings"></i>

Settings

</a>
</li>


</ul>


</aside>





<!-- Main -->

<main class="main-content">


<div class="topbar">


<h5 class="mb-0">

Dashboard

</h5>



<div>

<span class="badge whatsapp-status">

Checking...

</span>


<button class="btn btn-sm btn-outline-secondary ms-3"
onclick="logout()">

Logout

</button>

</div>


</div>





<div class="page-content fade-in">


<div class="row g-4">



<div class="col-md-3">

<div class="card dashboard-card shadow-soft p-4">

<h6>
Contacts
</h6>

<h2 id="totalContacts">
0
</h2>

</div>

</div>





<div class="col-md-3">

<div class="card dashboard-card shadow-soft p-4">

<h6>
Groups
</h6>

<h2 id="totalGroups">
0
</h2>

</div>

</div>





<div class="col-md-3">

<div class="card dashboard-card shadow-soft p-4">

<h6>
Campaigns
</h6>

<h2 id="totalCampaigns">
0
</h2>

</div>

</div>





<div class="col-md-3">

<div class="card dashboard-card shadow-soft p-4">

<h6>
Pending Queue
</h6>

<h2 id="pendingQueue">
0
</h2>

</div>

</div>



</div>





<div class="row mt-4">


<div class="col-md-6">


<div class="card dashboard-card p-4 shadow-soft">


<h5>

Campaign Status

</h5>


<canvas id="campaignChart"></canvas>


</div>


</div>



<div class="col-md-6">


<div class="card dashboard-card p-4 shadow-soft">


<h5>

Recent Campaigns

</h5>


<table class="table">

<thead>

<tr>

<th>Name</th>

<th>Status</th>

</tr>

</thead>


<tbody id="recentCampaigns">

</tbody>


</table>


</div>


</div>


</div>



</div>

<div id="appFooter"></div>

</main>

</div>


<script src="../assets/js/api.js"></script>

<script src="../assets/js/common.js"></script>

<script src="../assets/js/branding.js"></script>

<script src="../assets/js/whatsapp.js"></script>

<script src="../licensing/license-check.js"></script>

<script src="dashboard.js"></script>

<script src="../assets/js/footer.js"></script>
</body>

</html>
